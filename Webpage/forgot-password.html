<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkSmart – Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:#1a56db; --primary-light:#ebf0ff; --bg:#f0f4f9; --white:#fff;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --error:#dc2626; --error-bg:#fef2f2; --success:#059669; --success-bg:#ecfdf5;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
  nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;}
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .nav-logo-mark{width:36px;height:36px;background:var(--primary);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .nav-logo-name{font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;color:var(--primary);}
  .page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .card{background:var(--white);border-radius:18px;border:1.5px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,0.10);width:100%;max-width:440px;overflow:hidden;}
  .card-top{background:linear-gradient(135deg,#f59e0b,#d97706);padding:32px 36px 28px;color:white;}
  .card-top h1{font-family:'Poppins',sans-serif;font-size:24px;font-weight:800;margin-bottom:5px;}
  .card-top p{font-size:14px;opacity:0.8;}
  .card-body{padding:32px 36px 36px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .input-wrap{position:relative;}
  .input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
  input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,219,0.12);}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;}
  .btn-orange{background:#f59e0b;color:white;box-shadow:0 2px 8px rgba(245,158,11,0.28);}
  .btn-orange:hover{background:#d97706;}
  .btn-orange:disabled{opacity:0.65;cursor:not-allowed;}
  .btn-back{background:var(--primary-light);color:var(--primary);border:1.5px solid #bfdbfe;margin-top:10px;}
  .btn-back:hover{background:#dbeafe;}
  .alert{display:none;padding:11px 14px;border-radius:9px;font-size:13px;font-weight:500;margin-bottom:20px;align-items:center;gap:8px;}
  .alert.show{display:flex;}
  .alert-error{background:var(--error-bg);color:var(--error);border:1px solid #fca5a5;}
  .alert-success{background:var(--success-bg);color:var(--success);border:1px solid #a7f3d0;}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Step 2 - reset form */
  #step2{display:none;}
  .toggle-pw{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted);padding:0;}
  footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>

<nav>
  <a href="user.html" class="nav-logo">
    <div class="nav-logo-mark">🅿</div>
    <div class="nav-logo-name">ParkSmart</div>
  </a>
</nav>

<div class="page">
  <div class="card">
    <div class="card-top">
      <h1>Reset Password</h1>
      <p>Enter your email to receive a reset token</p>
    </div>
    <div class="card-body">

      <div class="alert alert-error" id="errorAlert"><span>⚠️</span><span id="errorMsg"></span></div>
      <div class="alert alert-success" id="successAlert"><span>✅</span><span id="successMsg"></span></div>

      <!-- Step 1: Enter email -->
      <div id="step1">
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">📧</span>
            <input type="email" id="email" placeholder="you@example.com">
          </div>
        </div>
        <button class="btn btn-orange" id="sendBtn" onclick="sendReset()">
          <div class="spinner" id="spinner1"></div>
          <span id="sendText">Send Reset Token</span>
        </button>
        <a href="index.html" class="btn btn-back" style="text-decoration:none;margin-top:10px;">← Back to Sign In</a>
      </div>

      <!-- Step 2: Enter token + new password -->
      <div id="step2">
        <p style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6">
          Enter the reset token you received, then choose a new password.
        </p>
        <div class="field">
          <label for="token">Reset Token</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input type="text" id="token" placeholder="Paste your reset token here">
          </div>
        </div>
        <div class="field">
          <label for="newpw">New Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="newpw" placeholder="At least 6 characters">
            <button class="toggle-pw" onclick="togglePw()" type="button">👁</button>
          </div>
        </div>
        <button class="btn btn-orange" id="resetBtn" onclick="doReset()">
          <div class="spinner" id="spinner2"></div>
          <span id="resetText">Reset Password</span>
        </button>
      </div>

    </div>
  </div>
</div>

<footer>© 2025 ParkSmart · Smart Parking Management System</footer>

<script>
const BASE = "https://smart-parking-backend-u60i.onrender.com";

function showError(msg) {
  document.getElementById("errorMsg").textContent = msg;
  document.getElementById("errorAlert").classList.add("show");
  document.getElementById("successAlert").classList.remove("show");
}

function showSuccess(msg) {
  document.getElementById("successMsg").textContent = msg;
  document.getElementById("successAlert").classList.add("show");
  document.getElementById("errorAlert").classList.remove("show");
}

function togglePw() {
  const input = document.getElementById("newpw");
  input.type = input.type === "password" ? "text" : "password";
}

async function sendReset() {
  const email = document.getElementById("email").value.trim();
  if (!email) { showError("Please enter your email"); return; }

  document.getElementById("sendBtn").disabled = true;
  document.getElementById("spinner1").style.display = "block";
  document.getElementById("sendText").textContent = "Sending...";

  try {
    const res  = await fetch(`${BASE}/api/auth/forgot-password`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email})
    });
    const data = await res.json();

    // Show token directly (in production this would come via email)
    if (data.reset_token) {
      document.getElementById("token").value = data.reset_token;
      showSuccess("Token generated! It has been pre-filled below. Enter your new password.");
    } else {
      showSuccess("If that email exists, a reset token has been sent.");
    }

    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";

  } catch(e) {
    showError("Network error — please try again");
    document.getElementById("sendBtn").disabled = false;
  }
  document.getElementById("spinner1").style.display = "none";
}

async function doReset() {
  const token   = document.getElementById("token").value.trim();
  const newpw   = document.getElementById("newpw").value;

  if (!token || !newpw) { showError("Please fill in all fields"); return; }
  if (newpw.length < 6) { showError("Password must be at least 6 characters"); return; }

  document.getElementById("resetBtn").disabled = true;
  document.getElementById("spinner2").style.display = "block";
  document.getElementById("resetText").textContent = "Resetting...";

  try {
    const res  = await fetch(`${BASE}/api/auth/reset-password`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({token, new_password: newpw})
    });
    const data = await res.json();

    if (!res.ok) { showError(data.detail || "Reset failed"); document.getElementById("resetBtn").disabled = false; document.getElementById("spinner2").style.display = "none"; return; }

    showSuccess("Password reset successfully! Redirecting to login...");
    setTimeout(() => window.location.href = "index.html", 1500);

  } catch(e) {
    showError("Network error — please try again");
    document.getElementById("resetBtn").disabled = false;
    document.getElementById("spinner2").style.display = "none";
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if (document.getElementById("step2").style.display === "block") doReset();
    else sendReset();
  }
});
</script>
</body>
</html>
